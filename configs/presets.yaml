# PURE deformable hardware presets aligned with openvocab_rel/config.py.
#
# NOT LOADED BY ANY CODE. This file is documentation only -- a repo-wide grep
# confirms nothing in openvocab_rel/ or tools/ reads presets.yaml. The actual
# --gpu_preset / --a100_ddp_preset / --stage behavior comes from the
# hardcoded Python logic in openvocab_rel/config.py's apply_gpu_preset(),
# apply_ddp_a100_preset(), and apply_stage_config() -- nothing here is
# consumed at runtime, and nothing enforces that the two stay in sync.
# Treat the values below as a (currently unverified) description of what
# those functions do, not as something you can edit to change behavior.
# See docs/known_issues.md for this gap; wiring this file up for real, or
# deleting it, is a follow-up cleanup decision, not made in this pass.

presets:
  a100_80gb_balanced:
    description: "A100 80GB balanced preset for stable PURE training/eval"
    gpu_preset: a100_80gb_balanced
    amp: true
    amp_dtype: bf16
    fp8_enabled: false
    channels_last: true
    loader_prefetch_factor: 4
    eval_fast_mode: false
    eval_sgg_report_nograph: true
    eval_sgg_use_no_interaction_prior: false
    vector_fusion_gate: true
    deformable_routing_enabled: true
    deformable_num_points: 8
    deformable_offset_scale: 0.35
    eval_sgg_use_clip_obj_classifier: true
    eval_sgg_grounding_dino_enabled: true
    stages:
      stage1: {stage: 1, clip_input_res: 336, batch_size: 128, epochs: 2, freeze_clip: true, gradient_checkpointing: false, deformable_routing_enabled: true}
      stage2: {stage: 2, clip_input_res: 448, batch_size: 16, epochs: 8, freeze_clip: false, progressive_unfreeze: true, gradient_checkpointing: true, deformable_routing_enabled: true}
      stage3: {stage: 3, clip_input_res: 448, batch_size: 24, freeze_clip: false, gradient_checkpointing: true, deformable_routing_enabled: true}

  a100_80gb_throughput:
    description: "A100 80GB throughput preset; use when dataloader and VRAM headroom are healthy"
    gpu_preset: a100_80gb_throughput
    amp: true
    amp_dtype: bf16
    fp8_enabled: false
    channels_last: true
    loader_prefetch_factor: 4
    eval_fast_mode: false
    eval_sgg_report_nograph: true
    eval_sgg_use_no_interaction_prior: false
    vector_fusion_gate: true
    deformable_routing_enabled: true
    deformable_num_points: 8
    deformable_offset_scale: 0.35
    eval_sgg_use_clip_obj_classifier: true
    eval_sgg_grounding_dino_enabled: true
    stages:
      stage1: {stage: 1, clip_input_res: 336, batch_size: 128, epochs: 2, freeze_clip: true, gradient_checkpointing: false, deformable_routing_enabled: true}
      stage2: {stage: 2, clip_input_res: 448, batch_size: 16, epochs: 8, freeze_clip: false, progressive_unfreeze: true, gradient_checkpointing: true, deformable_routing_enabled: true}
      stage3: {stage: 3, clip_input_res: 448, batch_size: 32, freeze_clip: false, gradient_checkpointing: true, deformable_routing_enabled: true}

  l4_24gb:
    description: "L4 24GB preset for single-GPU PURE runs"
    gpu_preset: l4_24gb
    amp: true
    amp_dtype: bf16
    fp8_enabled: false
    expandable_segments: true
    channels_last: true
    loader_prefetch_factor: 2
    eval_fast_mode: false
    eval_sgg_report_nograph: true
    eval_sgg_use_no_interaction_prior: false
    vector_fusion_gate: true
    deformable_routing_enabled: true
    deformable_num_points: 8
    deformable_offset_scale: 0.35
    eval_sgg_use_clip_obj_classifier: true
    eval_sgg_grounding_dino_enabled: false
    stages:
      stage1: {stage: 1, clip_input_res: 336, batch_size: 64, epochs: 2, freeze_clip: true, gradient_checkpointing: false, deformable_routing_enabled: true}
      stage2: {stage: 2, clip_input_res: 448, batch_size: 16, epochs: 8, freeze_clip: false, progressive_unfreeze: true, gradient_checkpointing: true, deformable_routing_enabled: true}
      stage3: {stage: 3, clip_input_res: 448, batch_size: 12, freeze_clip: false, gradient_checkpointing: true, deformable_routing_enabled: true}

  stage2_a100_ddp4:
    description: "PURE Stage 2 on 4x A100 using the dedicated DDP preset"
    stage: 2
    a100_ddp_preset: 4x
    clip_input_res: 448
    epochs: 8
    amp: true
    amp_dtype: bf16
    fp8_enabled: false
    deformable_routing_enabled: true
  stage3_a100_ddp8:
    description: "PURE Stage 3 on 8x A100 using the dedicated DDP preset"
    stage: 3
    a100_ddp_preset: 8x
    clip_input_res: 448
    epochs: 6
    amp: true
    amp_dtype: bf16
    fp8_enabled: false
    deformable_routing_enabled: true

  pure_phase1_calibrated_spoa:
    description: "Phase 1 preset: bounded learnable calibration with explicit SPOA enabled"
    explicit_spoa_enabled: true
    adaptive_calibration_enabled: true
    adaptive_prior_enabled: true
    bias_residual_enabled: true
    adaptive_prior_gate_min: 0.05
    adaptive_prior_gate_max: 0.65
    lambda_calibration_reg: 0.001
    lambda_calibration_kl: 0.02
    lambda_calibration_rank: 0.05
    calibration_rank_margin: 0.20
    predicate_label_relaxation_enabled: false

  pure_phase2_spoa_relaxed:
    description: "Phase 2 preset: explicit multi-branch SPOA plus soft ambiguous-negative relaxation"
    explicit_spoa_enabled: true
    spoa_role_dropout: 0.05
    spoa_attr_scale: 1.0
    adaptive_calibration_enabled: true
    adaptive_prior_enabled: true
    bias_residual_enabled: true
    adaptive_prior_gate_min: 0.05
    adaptive_prior_gate_max: 0.75
    lambda_calibration_reg: 0.001
    lambda_calibration_kl: 0.03
    lambda_calibration_rank: 0.08
    calibration_rank_margin: 0.25
    predicate_label_relaxation_enabled: true
    predicate_label_relaxation_epsilon: 0.08
    predicate_label_relaxation_threshold: 0.72
    predicate_label_relaxation_topk: 4
    lambda_counterfactual: 0.05
    predicate_counterfactual_enabled: true

  l4_24gb_phase34:
    description: "L4 24GB Phase 3/4 preset: text-conditioned predicates plus relationness-pruned SGDet eval"
    gpu_preset: l4_24gb
    stage: 3
    clip_input_res: 448
    batch_size: 12
    gradient_checkpointing: true
    explicit_spoa_enabled: true
    adaptive_calibration_enabled: true
    predicate_label_relaxation_enabled: true
    text_conditioned_projection_enabled: true
    text_conditioned_projection_residual: 0.35
    lambda_text_predicate_ce: 0.4
    relationness_enabled: true
    lambda_relationness: 0.15
    eval_sgg_predicate_score_mode: ensemble
    eval_sgg_predicate_ensemble_alpha: 0.45
    eval_sgg_use_relationness: true
    eval_sgg_relationness_weight: 0.75
    eval_sgg_relationness_prune_k: 96
    eval_sgg_detector_prune_k: 128
    eval_sgg_use_object_uncertainty: true
    eval_sgg_object_score_power: 1.0

  pure_five_phase_hooks:
    description: "Enable all five extension hooks: SGCls, SGDet, one-stage facade, open-vocabulary predicates, and retrieval indexing"
    stage: 3
    eval_sgg_use_clip_obj_classifier: true
    eval_sgg_grounding_dino_enabled: true
    one_stage_facade_enabled: true
    one_stage_max_pairs: 256
    text_conditioned_projection_enabled: true
    open_vocab_predicate_primary: true
    open_vocab_classifier_aux_weight: 0.25
    relationness_enabled: true
    lambda_relationness: 0.15
    eval_sgg_use_relationness: true
    eval_sgg_relationness_prune_k: 128
    retrieval_index_enabled: true
    retrieval_triplets_per_image: 100

  a100_40gb_phase34:
    description: "A100 40GB Phase 3/4 preset: higher-throughput text-conditioned + relationness SGDet path"
    gpu_preset: a100_40gb
    stage: 3
    clip_input_res: 448
    batch_size: 16
    gradient_checkpointing: true
    loader_prefetch_factor: 3
    rel_queue_size: 16384
    explicit_spoa_enabled: true
    adaptive_calibration_enabled: true
    predicate_label_relaxation_enabled: true
    text_conditioned_projection_enabled: true
    text_conditioned_projection_residual: 0.35
    lambda_text_predicate_ce: 0.5
    relationness_enabled: true
    lambda_relationness: 0.18
    eval_sgg_predicate_score_mode: ensemble
    eval_sgg_predicate_ensemble_alpha: 0.45
    eval_sgg_use_relationness: true
    eval_sgg_relationness_weight: 0.80
    eval_sgg_relationness_prune_k: 128
    eval_sgg_detector_prune_k: 192
    eval_sgg_use_object_uncertainty: true
    eval_sgg_object_score_power: 1.0
  pure_next_asym_role_pilot:
    description: "PURE-next pilot: asymmetric pair fusion plus role-swap diagnostics for PredCls"
    gpu_preset: l4_24gb
    stage: 3
    clip_input_res: 448
    batch_size: 8
    accum_steps: 2
    samples_per_epoch: 8000
    eval_batches: 100
    max_objects: 32
    max_pairs: 64
    explicit_spoa_enabled: true
    asymmetric_pair_fusion_enabled: true
    asymmetric_pair_fusion_include_reverse_diff: true
    asymmetric_pair_fusion_hidden_mult: 2.0
    predicate_metadata_path: configs/predicate_metadata_vg150.json
    eval_sgg_role_swap_metric_enabled: true
    eval_sgg_role_swap_margin: 0.0
    eval_sgg_routing_diag_enabled: true
    eval_sgg_use_gt_pairs: false
    eval_sgg_predicate_score_mode: ensemble
    eval_sgg_compare_score_modes: classifier,text,ensemble
    checkpoint_selection_lambda_mr: 1.0
    checkpoint_selection_mu_tail: 1.0
  pure_next_role_tail_pilot:
    description: "PURE-next pilot: asymmetric fusion + sampler + role ranking + group relaxation + tail logit adjustment"
    gpu_preset: l4_24gb
    stage: 3
    clip_input_res: 448
    batch_size: 8
    accum_steps: 2
    samples_per_epoch: 10000
    eval_batches: 100
    max_objects: 32
    max_pairs: 64
    learned_prune_k: 64
    explicit_spoa_enabled: true
    asymmetric_pair_fusion_enabled: true
    asymmetric_pair_fusion_include_reverse_diff: true
    asymmetric_pair_fusion_hidden_mult: 2.0
    predicate_sampler_enabled: true
    predicate_sampler_power: 0.75
    predicate_sampler_max_weight: 20.0
    predicate_label_relaxation_enabled: true
    predicate_group_relaxation_enabled: true
    predicate_group_relaxation_epsilon: 0.04
    predicate_metadata_path: configs/predicate_metadata_vg150.json
    lambda_role_swap_rank: 0.08
    role_swap_rank_margin: 0.20
    tail_logit_adjustment_enabled: true
    tail_logit_adjustment_tau: 0.25
    eval_sgg_role_swap_metric_enabled: true
    eval_sgg_role_swap_margin: 0.0
    eval_sgg_routing_diag_enabled: true
    eval_sgg_use_gt_pairs: false
    eval_sgg_predicate_score_mode: classifier
    eval_sgg_compare_score_modes: classifier,text,ensemble
    checkpoint_selection_lambda_mr: 1.0
    checkpoint_selection_mu_tail: 3.0